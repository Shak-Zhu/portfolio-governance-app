name = "pmo-governance"
main = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# 静态资源目录：非 /api/* 请求由 env.ASSETS 提供
[assets]
directory = "./public"
binding = "ASSETS"
html_handling = "none"
not_found_handling = "none"

# 已由 Codex PM/基础设施负责人创建并验证的生产 D1 绑定。
[[d1_databases]]
binding = "DB"
database_name = "pmo-governance-prod"
database_id = "abb3c863-7689-40d1-9e69-f5b64b261f9a"

[[r2_buckets]]
binding = "BACKUPS"
bucket_name = "pmo-governance-backups-prod"

# Worker Secrets（必须由 Codex 通过 `wrangler secret put` 在生产设置；本地可写 .dev.vars）：
#   SHAK_PMO_WEB_LOGIN_EMAIL     - 唯一合法账号邮箱
#   SHAK_PMO_WEB_LOGIN_PASSWORD  - 唯一合法账号密码
#   SHAK_PMO_SESSION_SECRET      - 用于 Session Cookie HMAC 签名
#   SHAK_PMO_MCP_TOKEN           - 单一 MCP Bearer Token（生产由 Codex 注入）
#   SHAK_PMO_SKILL_SOURCE_COMMIT - Codex 发布后写入的 40 位 Git commit（非敏感；固定 GitHub Skill Bundle 链接）
# 本地开发：复制 .dev.vars.example 为 .dev.vars 并填入临时值（不得提交）。
