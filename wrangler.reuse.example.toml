# 新实例模板：复制为 wrangler.reuse.toml，填写新账号创建的资源 ID。
# 所有命令显式传 --config wrangler.reuse.toml；原 wrangler.toml 属于现有生产实例。
name = "shak-pmo-reuse"
main = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[triggers]
crons = ["0 3 * * *"]

[assets]
directory = "./public"
binding = "ASSETS"
html_handling = "none"
not_found_handling = "none"

[[d1_databases]]
binding = "DB"
database_name = "shak-pmo-reuse-db"
database_id = "REPLACE_WITH_NEW_MAIN_D1_ID"
migrations_dir = "migrations"

[[d1_databases]]
binding = "RESTORE_DRILL_DB"
database_name = "shak-pmo-reuse-drill"
database_id = "REPLACE_WITH_NEW_DRILL_D1_ID"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "BACKUPS"
bucket_name = "shak-pmo-reuse-backups"

# 五项发布配置通过 wrangler secret put 写入，详见 docs/REBUILD.md。
# 自定义域名可在 Worker Dashboard 配置，初次也可使用 workers.dev 域名。
